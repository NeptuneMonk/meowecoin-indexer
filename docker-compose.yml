# One command starts the indexer. The database stays in ./data on this computer.
# The website port is published only on 127.0.0.1, so other computers cannot open it.

services:
  indexer:
    build: .
    restart: unless-stopped
    environment:
      DOGE_RPC_URL: ${DOGE_RPC_URL:-http://host.docker.internal:22555}
      DOGE_RPC_USER: ${DOGE_RPC_USER:-meowe}
      DOGE_RPC_PASSWORD: ${DOGE_RPC_PASSWORD:-change-this-password}
      START_HEIGHT: ${START_HEIGHT:-0}
      # Inside the container the API must listen on every interface.
      # The ports line below still only opens it on this computer.
      BIND_HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      DB_PATH: /app/data/meowecoin-indexer.sqlite
      VERSION_BYTE: ${VERSION_BYTE:-30}
      POLL_MS: ${POLL_MS:-15000}
      BATCH_BLOCKS: ${BATCH_BLOCKS:-200}
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
